server:
  port: 8080

# ============================================================
# 运行期根目录（运行时数据、外部资源的定位基准）
#   默认值 = 启动 Java 进程时的工作目录，即「cd 到项目根再启动」时自动指向项目根
#   服务器上推荐显式指定，例如：export TRADE_HOME=/opt/trade
# 所有项目内资源都以此为准，不再依赖开发机的盘符路径。
# ============================================================
trade:
  home: ${TRADE_HOME:${user.dir}}

# ============================================================
# JWT 签名密钥
#   ⚠️ 泄露即可伪造任意用户登录令牌。
#      真实值放在项目根 config/.env 的 JWT_SECRET（该文件不入库，见 config/README.md）。
#      未配置时应用会启动失败，这是刻意设计——避免用公开默认值签名。
# ============================================================
jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}


spring:
  # 数据源配置（凭据见 config/.env，不入库）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:foreign_trade_qa_db}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000

  # Redis配置

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

# 文件存储路径配置（运行期自建，应用启动时会自动创建）
upload:
  file:
    location: ${trade.home}/runtime/uploadFiles/

# 图数据库配置（Apache Jena TDB，运行期自建目录）
ontology:
  graph:
    store-path: ${trade.home}/runtime/ontology-graph-store
    named-graph-prefix: http://example.org/ontology/
  # 本体框架文件路径（trade.rdf），用于 CSV→RDF 转换与一致性校验
  schema-path: ${trade.home}/deliverables/本体与映射规则/trade（protege建模导出）.rdf

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:generator/mapper/*.xml
  type-aliases-package: com.example.tdproject.generator.domain,com.example.tdproject.User
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl


# SpringDoc OpenAPI配置
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  packages-to-scan: com.example.tdproject.controller,com.example.tdproject.ai.controller

# AI 统一入口配置（千问相关敏感信息请自行填写，不要提交到版本库）
ai:
  tradeSpringBoot:
    base-url: http://127.0.0.1:8081/api
  flask:
    base-url: http://127.0.0.1:5000
  # 历史数据查询（DATA_QUERY 路由）用的库名。
  # trade_in / trade_out 不在主数据源 foreign_trade_qa_db 里，而在 trade 库；
  # TradeDataQueryService 复用主 DataSource，SQL 里用 trade.xxx 跨库限定名。
  data:
    db: ${TRADE_DATA_DB:trade}
  qwen:
    api-key:
    base-url: ${QWEN_BASE_URL:}
    chat:
      model:
    embedding:
      model:
    endpoints:
      chat: ${QWEN_CHAT_ENDPOINT:}
      embedding: ${QWEN_EMBEDDING_ENDPOINT:}
  milvus:
    host: ${MILVUS_HOST:127.0.0.1}
    port: ${MILVUS_PORT:19530}
    collection: ${MILVUS_COLLECTION:news_corpus}
    dimension: ${MILVUS_DIMENSION:1024}
    topK: ${MILVUS_TOPK:5}

  # ------------------------------------------------------------------
  # 问答大模型（OpenAI 兼容协议：/chat/completions 与 /embeddings）
  #   chat 与 embedding 允许是两家不同服务商：
  #     对话 → DeepSeek（deepseek-chat），密钥复用 DEEPSEEK_API_KEY
  #     嵌入 → SiliconFlow（BAAI/bge-m3，1024 维，正好匹配向量库维度）
  #   若日后在 GPU 机器上部署本地 Qwen3.5-9B（vLLM 的 OpenAI 兼容服务），
  #   只需把 ai.llm.chat.base-url 指向该服务、model 改成其模型名即可，代码无需改动。
  #   凭据统一放在 config/.env（不入库）。
  # ------------------------------------------------------------------
  llm:
    chat:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_CHAT_MODEL:deepseek-chat}
      endpoint-path: ${DEEPSEEK_CHAT_PATH:/chat/completions}
    embedding:
      base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
      api-key: ${SILICONFLOW_API_KEY:}
      model: ${SILICONFLOW_EMBEDDING_MODEL:BAAI/bge-m3}
      endpoint-path: ${SILICONFLOW_EMBEDDING_PATH:/embeddings}
      dimension: ${EMBEDDING_DIM:1024}
      # 建索引参数：batch-size 为单请求条数，concurrency 为并发请求数。
      #
      # 注意：吞吐上限并非由并发决定，而是由服务端账号的 TPM（每分钟 token）配额决定。
      # 实测 SiliconFlow 免费额度下，并发 4 时大量请求返回
      #   HTTP 429 "Request was rejected due to rate limiting. Details: TPM limit reached."
      # 此时再提高并发只会制造更多 429，反而更慢 —— 关键是遇到 429 要按秒级退避
      # （见 LlmClient.backoffMs），而不是毫秒级重试。
      batch-size: ${EMBEDDING_BATCH_SIZE:64}
      concurrency: ${EMBEDDING_CONCURRENCY:4}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:120}
    # 重试次数需足以覆盖一次配额窗口：429 下退避为 5s/10s/20s/40s（含抖动），
    # 5 次尝试累计等待约 75s；沿用 3 次时窗口往往还没刷新就已耗尽重试。
    max-retries: ${LLM_MAX_RETRIES:5}

  # 向量库选型：local（默认，向量存 MySQL + 内存精确检索）| milvus（需自行部署 Milvus）
  vector:
    provider: ${VECTOR_PROVIDER:local}
    topK: ${VECTOR_TOPK:5}
    # 一次检索取回的候选条数（会自动抬到不低于 topK）。
    # topK 管「喂给大模型多少条」，本值管「取回来展示多少条」——
    # 本地向量库是全量余弦扫描后取 top-k，k 从 5 提到 20 的耗时差在毫秒以内，
    # 所以调大本值可以在不改耗时的前提下，让用户看到真实的检索候选规模。
    candidate-topk: ${VECTOR_CANDIDATE_TOPK:20}

integration:
  aj-report:
    base-url: ${AJ_REPORT_BASE_URL:http://127.0.0.1:9095}
    entry-path: ${AJ_REPORT_ENTRY_PATH:/}
    # 大屏分享码：必须与 aj_report 库 gaea_report_share.share_code 一致，
    # 否则 /index.html#/aj/<code> 会报「分享链接已失效」。
    # 当前两条记录由 deploy/init_aj_report.sh 生成（JWT 用 aj-report 作 HMAC 密钥签名）。
    screen1-path: ${AJ_REPORT_SCREEN1_PATH:/index.html#/aj/KhTradeA1}
    screen2-path: ${AJ_REPORT_SCREEN2_PATH:/index.html#/aj/KhTradeB2}
    embed-enabled: ${AJ_REPORT_EMBED_ENABLED:true}
    frame-title: ${AJ_REPORT_FRAME_TITLE:AJ-Report 大屏入口}

crawler:
  base-url: ${CRAWLER_BASE_URL:http://127.0.0.1:56887}
  callback-base-url: ${CRAWLER_CALLBACK_BASE_URL:http://127.0.0.1:8080}
  enabled-sources:
    - kazinform
    - mofcom
