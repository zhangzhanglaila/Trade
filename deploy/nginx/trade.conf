# ================================================================
# 中哈贸易系统 · Nginx 生产配置
#
# 为什么需要它：
#   前端 src/utils/request.js 里 baseURL 是空字符串，所有请求都以
#   相对路径发出（/api、/ai、/ontology …）。开发环境靠
#   vue.config.js 的 devServer.proxy 转发，生产环境必须由 Nginx
#   承担同样的转发职责，否则前端一部署就全部 404。
#
# 用法：
#   cp trade.conf /etc/nginx/conf.d/trade.conf
#   修改 root 指向真实的前端 dist 目录
#   nginx -t && nginx -s reload
# ================================================================

upstream trade_backend {
    server 127.0.0.1:8080;      # 主后端 backend-main
    keepalive 32;
}

upstream trade_training {
    server 127.0.0.1:8081;      # 训练后端 backend-training（context-path=/api）
    keepalive 16;
}

upstream trade_flask {
    server 127.0.0.1:5000;      # Python Flask 预测服务
    keepalive 16;
}

upstream trade_ajreport {
    server 127.0.0.1:9095;      # AJ-Report 大屏（可选）
    keepalive 8;
}

server {
    listen       80;
    server_name  _;

    charset utf-8;
    client_max_body_size 200m;          # 与本项目 multipart 上限匹配

    # ---------------- 前端静态资源 ----------------
    location / {
        root  /opt/trade/src/frontend-vue/dist;
        index index.html;
        try_files $uri $uri/ /index.html;      # Vue Router history 模式
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot|ico)$ {
        root  /opt/trade/src/frontend-vue/dist;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ---------------- 后端接口 ----------------
    # 注意：nginx 前缀匹配取“最长优先”，
    # 所以 /api/training 与 /api/data 会先于 /api 命中，无需关心书写顺序。

    # 训练后端（8081，自身 context-path 已是 /api，故 proxy_pass 不带路径）
    location /api/training {
        proxy_pass http://trade_training;
        include /etc/nginx/proxy_params_trade.conf;
    }
    location /api/data {
        proxy_pass http://trade_training;
        include /etc/nginx/proxy_params_trade.conf;
    }

    # 主后端（8080）：/api、/ai、/ontology、/news、/logistics、/auth、/user
    location /api/ {
        proxy_pass http://trade_backend;
        include /etc/nginx/proxy_params_trade.conf;
    }
    location /ai/ {
        proxy_pass http://trade_backend;
        include /etc/nginx/proxy_params_trade.conf;
    }
    location /ontology/ {
        proxy_pass http://trade_backend;
        include /etc/nginx/proxy_params_trade.conf;
    }
    location /news/ {
        proxy_pass http://trade_backend;
        include /etc/nginx/proxy_params_trade.conf;
    }
    location /logistics/ {
        proxy_pass http://trade_backend;
        include /etc/nginx/proxy_params_trade.conf;
    }
    location /auth/ {
        proxy_pass http://trade_backend;
        include /etc/nginx/proxy_params_trade.conf;
    }
    location /user/ {
        proxy_pass http://trade_backend;
        include /etc/nginx/proxy_params_trade.conf;
    }

    # AJ-Report 大屏（可选组件；未部署时访问会 502，可从导航中隐藏）
    location /aj-report/ {
        proxy_pass http://trade_ajreport;
        include /etc/nginx/proxy_params_trade.conf;
    }

    # 大文件导入（RDF/CSV）超时放宽
    location /api/ontology/import {
        proxy_pass http://trade_backend;
        include /etc/nginx/proxy_params_trade.conf;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # 静态导出（前端图片导出等）
    location /files/ {
        alias /opt/trade/runtime/uploadFiles/;
        autoindex off;
    }
}
