# ================================================================
# 中哈贸易系统 · Nginx 生产配置
#
# 为什么需要它：
#   前端 src/utils/request.js 里 baseURL 是空字符串，所有请求都以
#   相对路径发出（/api、/ai、/ontology …）。开发环境靠
#   vue.config.js 的 devServer.proxy 转发，生产环境必须由 Nginx
#   承担同样的转发职责，否则前端一部署就全部 404。
#
# 用法：
#   cp trade.conf /etc/nginx/conf.d/trade.conf
#   修改 root 指向真实的前端 dist 目录
#   nginx -t && nginx -s reload
# ================================================================

upstream trade_backend {
    server 127.0.0.1:8080;      # 主后端 backend-main
    keepalive 32;
}

upstream trade_training {
    server 127.0.0.1:8081;      # 训练后端 backend-training（context-path=/api）
    keepalive 16;
}

upstream trade_flask {
    server 127.0.0.1:5000;      # Python Flask 预测服务
    keepalive 16;
}

upstream trade_ajreport {
    server 127.0.0.1:9095;      # AJ-Report 大屏；浏览器经 iframe / 直链访问，不经过 nginx
    keepalive 8;
}

server {
    listen       80 default_server;
    server_name  _;

    charset utf-8;
    client_max_body_size 200m;          # 与本项目 multipart 上限匹配

    # ---------------- 前端静态资源 ----------------
    location / {
        root  /home/wust_1/Trade/src/frontend-vue/dist;
        index index.html;
        try_files $uri $uri/ /index.html;      # Vue Router history 模式
    }

    # index.html 每次向服务器校验，不做强缓存：它引用的是带内容哈希的 js/css，
    # 缓存住旧文件会让重新构建后的新前端加载不到（页面表现得像「改动没生效」）。
    # 精确匹配 = 的优先级高于 location /，try_files 的内部跳转也会落到这里。
    location = /index.html {
        root  /home/wust_1/Trade/src/frontend-vue/dist;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot|ico)$ {
        root  /home/wust_1/Trade/src/frontend-vue/dist;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ---------------- 后端接口 ----------------
    # 注意：nginx 前缀匹配取“最长优先”，
    # 所以 /api/training 与 /api/data 会先于 /api 命中，无需关心书写顺序。

    # 训练后端（8081，自身 context-path 已是 /api，故 proxy_pass 不带路径）
    location /api/training {
        proxy_pass http://trade_training;
        include /etc/nginx/proxy_params_trade.conf;
    }
    location /api/data {
        proxy_pass http://trade_training;
        include /etc/nginx/proxy_params_trade.conf;
    }

    # 主后端（8080）：/api、/ai、/ontology、/news、/logistics、/auth、/user
    location /api/ {
        proxy_pass http://trade_backend;
        include /etc/nginx/proxy_params_trade.conf;
    }
    location /ai/ {
        proxy_pass http://trade_backend;
        include /etc/nginx/proxy_params_trade.conf;
    }
    location /ontology/ {
        proxy_pass http://trade_backend;
        include /etc/nginx/proxy_params_trade.conf;
    }
    location /news/ {
        proxy_pass http://trade_backend;
        include /etc/nginx/proxy_params_trade.conf;
    }
    location /logistics/ {
        proxy_pass http://trade_backend;
        include /etc/nginx/proxy_params_trade.conf;
    }
    location /auth/ {
        proxy_pass http://trade_backend;
        include /etc/nginx/proxy_params_trade.conf;
    }
    location /user/ {
        proxy_pass http://trade_backend;
        include /etc/nginx/proxy_params_trade.conf;
    }

    # ---------------- AJ-Report 大屏入口 ----------------
    # 前端「AJ-Report 大屏入口」页以绝对路径调用 /aj-report/config，
    # 这是主后端 8080（AjReportController）的接口，不是 9095 上的 SPA。
    #
    # 曾经把 location /aj-report/ 整个反代到 9095 → /aj-report/config 打到
    # AJ-Report 自己的 SPA 上，返回 502，大屏入口页报「获取配置失败」。
    #
    # 改为只用精确匹配接管后端接口，原因：
    #   1) /aj-report 是前端 Vue Router 的路由，必须留给 location / 交给 SPA。
    #      一旦定义 location /aj-report/ 这种带尾斜杠的前缀，nginx 会把
    #      /aj-report 自动 301 成 /aj-report/，从收藏夹或地址栏直接进入时
    #      就被后端重定向走，Vue 路由失配 → 白屏。
    #   2) 9095 上的 AJ-Report SPA 由页面 iframe 直连 http://<host>:9095 加载，
    #      本身不需要经过 nginx。
    location = /aj-report/config {
        proxy_pass http://trade_backend;
        include /etc/nginx/proxy_params_trade.conf;
    }
    location = /aj-report/go {
        proxy_pass http://trade_backend;
        include /etc/nginx/proxy_params_trade.conf;
    }

    # 大文件导入（RDF/CSV）超时放宽
    # 注意：此处不能 include proxy_params_trade.conf —— 那个文件里已经有
    # proxy_send_timeout / proxy_read_timeout，而 nginx 不允许同一层级重复
    # 出现这两条指令，会直接报 `"proxy_read_timeout" directive is duplicate`
    # 导致 nginx -t 失败。所以这里把公共参数就地展开，只把两个超时改成 1800s。
    location /api/ontology/import {
        proxy_pass http://trade_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 30s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        proxy_buffering off;
    }

    # 静态导出（前端图片导出等）
    location /files/ {
        alias /home/wust_1/Trade/runtime/uploadFiles/;
        autoindex off;
    }
}
